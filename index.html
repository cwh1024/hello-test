<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello, GitHub! · hello-test</title>
  <style>
    :root {
      --ink: #1f2328;
      --muted: #59636e;
      --line: #d1d9e0;
      --brand: #0969da;
      --brand-dark: #0550ae;
      --bg: #f6f8fa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.65;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 18%, #ddf4ff 0, transparent 45%),
        radial-gradient(circle at 85% 82%, #dafbe1 0, transparent 45%),
        var(--bg);
    }

    .card {
      width: min(100%, 600px);
      padding: 36px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(31, 35, 40, .08);
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      color: var(--brand-dark);
      background: #ddf4ff;
      border-radius: 999px;
    }

    h1 {
      margin: 14px 0 8px;
      font-size: clamp(26px, 6vw, 36px);
      line-height: 1.25;
    }

    p {
      margin: 8px 0;
      font-size: 15px;
      color: var(--muted);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    .btn {
      display: inline-block;
      padding: 9px 16px;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: var(--brand);
      border: 1px solid var(--brand);
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
    }

    .btn:hover {
      background: var(--brand-dark);
      border-color: var(--brand-dark);
    }

    .btn:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 3px;
    }

    .btn.ghost {
      color: var(--ink);
      background: #fff;
      border-color: var(--line);
    }

    .btn.ghost:hover {
      background: var(--bg);
      border-color: var(--line);
    }

    .msg {
      min-height: 1.6em;
      margin-top: 14px;
      font-size: 14px;
      font-weight: 600;
      color: var(--brand-dark);
    }

    footer {
      margin-top: 26px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-size: 12.5px;
      color: var(--muted);
    }

    @media (max-width: 520px) {
      body { padding: 16px; }
      .card { padding: 24px 18px; }
      .actions .btn { flex: 1 1 100%; text-align: center; }
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">TEST REPO</span>
    <h1>Hello, GitHub!</h1>
    <p>这是 hello-test 仓库的首页，用来测试 Git 提交、推送和网页展示。</p>
    <p>你可以随便改一行文字，提交一次，看看仓库里发生了什么。</p>

    <div class="actions">
      <button class="btn" id="tryBtn" type="button">点我试试</button>
      <a class="btn ghost" href="https://github.com/cwh1024/hello-test">查看仓库</a>
    </div>
    <p class="msg" id="msg" aria-live="polite">页面已经准备好了。</p>

    <footer>单文件页面 · 无第三方依赖 · 无需构建</footer>
  </main>

  <script>
    let clicks = 0;
    const button = document.getElementById("tryBtn");
    const message = document.getElementById("msg");

    button.addEventListener("click", () => {
      clicks += 1;
      message.textContent = clicks === 1
        ? "按钮工作正常。接下来试试改一行文字，再提交一次。"
        : "已经点了 " + clicks + " 次。多提交几次，流程就熟了。";
    });
  </script>
</body>
</html>
